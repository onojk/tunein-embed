<!doctype html>
<meta charset="utf-8">
<title>playback test</title>
<script src="../dist/player.js"></script>
<radio-player id="a" src="http://127.0.0.1:8001/live.mp3" title="Mock Icecast" meta="off" visualizer="off"></radio-player>
<radio-player id="b" src="http://127.0.0.1:8002/stream?drop=4" title="Dropping" meta="off" visualizer="off"></radio-player>
<script>
  // Headless run: chrome --autoplay-policy=no-user-gesture-required. Logs state changes, POSTs to /report.
  const log = [];
  const t0 = Date.now();
  document.addEventListener('rp-state', (e) => log.push(`${e.target.id}:${e.detail.state}@${((Date.now() - t0) / 1000).toFixed(1)}`));
  const report = (o) => fetch('/report', { method: 'POST', body: JSON.stringify(o) });
  a.play();
  setTimeout(() => {
    const aPlaying = a.state === 'playing' && a.audio.currentTime > 0;
    b.play(); // also checks that starting b pauses a
    setTimeout(() => {
      report({ test: 'playback', aPlaying, aPausedWhenBStarted: a.state === 'idle', bState: b.state, log });
    }, 14000);
  }, 5000);
</script>
