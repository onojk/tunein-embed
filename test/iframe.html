<!doctype html>
<meta charset="utf-8">
<title>iframe test</title>
<iframe id="f" src="../embed.html?src=http%3A%2F%2F127.0.0.1%3A8091%2Flive.mp3&title=Iframe%20FM&theme=light&accent=19c37d&history=on" style="width:100%;height:150px;border:0"></iframe>
<script>
  let heights = [];
  addEventListener('message', (e) => e.data && e.data.type === 'tunein-embed:height' && heights.push(e.data.height));
  setTimeout(() => {
    const p = f.contentDocument.querySelector('radio-player');
    fetch('/report', { method: 'POST', body: JSON.stringify({ test: 'iframe', theme: p.getAttribute('theme'),
      accent: p.style.getPropertyValue('--rp-accent'), now: p.shadowRoot.querySelector('.track span').textContent,
      reader: p._meta && p._meta.reader, heights }) });
  }, 4000);
</script>
