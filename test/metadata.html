<!doctype html>
<meta charset="utf-8">
<title>metadata test</title>
<script src="../dist/player.js"></script>
<radio-player id="ice" src="http://127.0.0.1:8001/live.mp3" visualizer="off" history="open" poll="5"></radio-player>
<radio-player id="sc" src="http://127.0.0.1:8002/stream" title="No CORS" visualizer="off" poll="5"></radio-player>
<radio-player id="custom" src="http://127.0.0.1:8001/live.mp3" meta="fixtures/azuracast.json" title="Custom" visualizer="off"></radio-player>
<radio-player id="off" src="http://127.0.0.1:8001/live.mp3" meta="off" title="Static Title" visualizer="off"></radio-player>
<script>
  const text = (el) => el.shadowRoot.querySelector('.track span').textContent;
  setTimeout(() => {
    fetch('/report', {
      method: 'POST',
      body: JSON.stringify({
        test: 'metadata',
        icecast: { now: text(ice), station: ice.stationName, reader: ice._meta && ice._meta.reader },
        shoutcastNoCors: { now: text(sc), metaGaveUp: !sc._metaTimer, fails: sc._metaFails },
        custom: { now: text(custom), art: custom.shadowRoot.querySelector('.art').getAttribute('src') },
        off: { now: text(off), meta: !!off._meta },
      }),
    });
  }, 9000);
</script>
