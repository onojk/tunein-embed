# HTTPS + CORS reverse proxy in front of an Icecast or SHOUTcast server.
# Fixes both "mixed content" (http stream on an https site) and missing CORS headers.
#
#   src="https://radio.example.com/stream"     -> http://127.0.0.1:8000/stream
#   meta auto-detect then finds https://radio.example.com/status-json.xsl (or /stats, /7.html)
#
# Get a certificate first, e.g.:  sudo certbot --nginx -d radio.example.com

server {
    listen 443 ssl;
    http2 on;
    server_name radio.example.com;

    ssl_certificate     /etc/letsencrypt/live/radio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Headers "Range";
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;      # your Icecast/SHOUTcast server
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent "Mozilla/5.0 (nginx proxy)";  # SHOUTcast v1 /7.html needs this

        # Live audio: don't buffer, don't time out mid-song.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Replace (not duplicate) any CORS header the upstream sends.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
}
